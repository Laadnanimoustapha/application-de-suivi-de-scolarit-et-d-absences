{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-0">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">Modifier la note : {{ note.nom_matiere }}</h5>
                </div>
                <div class="card-body p-4">
                    <p class="text-muted small">Élève : <strong>{{ note.nom_eleve }} {{ note.prenom_eleve }}</strong></p>
                    
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Note (/20)</label>
                            <input type="number" step="0.25" min="0" max="20" name="valeur" 
                                   class="form-control form-control-lg" value="{{ note.valeur }}" required>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Type d'évaluation</label>
                                <select class="form-select" name="type_evaluation">
                                    <option value="devoir" {% if note.type_evaluation == 'devoir' %}selected{% endif %}>Devoir</option>
                                    <option value="controle" {% if note.type_evaluation == 'controle' %}selected{% endif %}>Contrôle</option>
                                    <option value="examen" {% if note.type_evaluation == 'examen' %}selected{% endif %}>Examen</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Semestre</label>
                                <select class="form-select" name="semestre">
                                    <option value="S1" {% if note.semestre == 'S1' %}selected{% endif %}>Semestre 1</option>
                                    <option value="S2" {% if note.semestre == 'S2' %}selected{% endif %}>Semestre 2</option>
                                </select>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between mt-4">
                            <a href="{{ url_for('consulter_notes_eleve', id=note.eleve_id) }}" class="btn btn-light">Annuler</a>
                            <button type="submit" class="btn btn-success px-4">Enregistrer les changements</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
