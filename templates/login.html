{% extends 'base.html' %}

{% block navbar %}{% endblock %}

{% block content %}
<style>
    body {
        background-image: url("{{ url_for('static', filename='assets/main-background-image.png') }}");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        min-height: 100vh;
        display: flex;
        align-items: center;
    }

    /* Glassmorphism effect for the card */
    .login-card {
        background: rgba(255, 255, 255, 0.85) !important;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 1.5rem !important;
        overflow: hidden;
    }

    .card-header {
        background: transparent !important;
        border-bottom: 1px solid rgba(0, 0, 0, 0.05) !important;
    }

    .nav-pills .nav-link {
        color: #6c757d;
        font-weight: 500;
        border-radius: 0.75rem;
        transition: all 0.3s ease;
    }

    .nav-pills .nav-link.active {
        background-color: var(--bs-primary);
        box-shadow: 0 4px 12px rgba(13, 110, 253, 0.25);
    }

    .btn-primary {
        border-radius: 0.75rem;
        padding: 0.75rem;
        font-weight: 600;
        transition: all 0.3s ease;
    }

    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(13, 110, 253, 0.3);
    }
</style>

<div class="row justify-content-center w-100 m-0">
    <div class="col-md-5 col-lg-4">
        <div class="card login-card shadow-lg border-0">
            <div class="card-header bg-white text-center py-4">
                <h4 class="text-primary fw-bold">Identification</h4>
                <p class="text-muted small">Sélectionnez votre profil pour continuer</p>
            </div>
            <div class="card-body p-4">
                
                <ul class="nav nav-pills nav-justified mb-4" id="loginTabs" role="tablist">
                    <li class="nav-item">
                        <button class="nav-link active" id="etudiant-tab" data-bs-toggle="pill" data-bs-target="#etudiant" type="button">Élève</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" id="prof-tab" data-bs-toggle="pill" data-bs-target="#prof" type="button">Professeur</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" id="admin-tab" data-bs-toggle="pill" data-bs-target="#admin" type="button">Admin</button>
                    </li>
                </ul>

                <div class="tab-content">
                    <div class="tab-pane fade show active" id="etudiant">
                        <form action="/login/etudiant" method="POST">
                            <div class="mb-3">
                                <label class="form-label">Email Étudiant</label>
                                <input type="email" class="form-control" name="email" >
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Mot de passe</label>
                                <input type="password" class="form-control" name="mot_de_passe" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Se connecter</button>
                        </form>
                    </div>

                    <div class="tab-pane fade" id="prof">
                        <form action="/login/professeur" method="POST">
                            <div class="mb-3">
                                <label class="form-label">Email Enseignant</label>
                                <input type="email" class="form-control" name="email" required placeholder="professeur@lycee.ma">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Mot de passe</label>
                                <input type="password" class="form-control" name="mot_de_passe" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Accès Enseignant</button>
                        </form>
                    </div>
   
                    <div class="tab-pane fade" id="admin">
                        <form action="/login/admin" method="POST">
                            <div class="mb-3">
                                <label class="form-label">Email Administrateur</label>
                                <input type="email" class="form-control" name="email" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Mot de passe</label>
                                <input type="password" class="form-control" name="mot_de_passe" required>
                            </div>
                            <button type="submit" class="btn btn-dark w-100">Connexion Admin</button>
                        </form>
                    </div>
                </div>

                {% if error %}
                <div class="alert alert-danger mt-3 py-2 text-center small">
                    {{ error }}
                </div>
                {% endif %}

            </div>
        </div>
    </div>
</div>
{% endblock %}
