{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4><i class="fas fa-user-cog"></i> Mon Profil</h4>
                </div>
                <div class="card-body">
                    <form action="/prof/update-profil" method="POST">
                        <div class="mb-3">
                            <label class="form-label">Prénom</label>
                            <input type="text" name="prenom" class="form-control" value="{{ session['prenom'] }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Nom</label>
                            <input type="text" name="nom" class="form-control" placeholder="Votre nom" required>
                        </div>
                        <div class="mb-3 border-top pt-3">
                            <label class="form-label text-danger fw-bold">Changer le mot de passe</label>
                            <input type="password" name="mot_de_passe" class="form-control" placeholder="Laissez vide pour ne pas changer">
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success">Enregistrer les modifications</button>
                            <a href="{{ url_for('prof_dash') }}" class="btn btn-outline-secondary">Retour</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
